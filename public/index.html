<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>北浜駅 列車モニター</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app-layout">
    <!-- 左側〜中央: 本画面（大きな文字で情報表示） -->
    <main id="main-screen">
      <div id="train-cards-container">
        <!-- ライブデータによって動的に生成 -->
        <div class="empty-state">
          <div class="empty-title">天神橋筋六丁目 方面</div>
          <div class="empty-desc">長堀橋〜北浜の走行データを読み込み中...</div>
        </div>
      </div>
    </main>

    <!-- 右端のバー: 常時上から長堀橋、堺筋本町、一番下に北浜 -->
    <aside id="right-bar">
      <!-- 縦のレール線 -->
      <div class="track-line"></div>

      <!-- 5つの等間隔スロット -->
      <!-- Slot 1: 長堀橋駅 -->
      <div class="bar-slot station-slot" id="slot-K16">
        <div class="train-anchor" id="anchor-K16"></div>
        <div class="station-mark">
          <span class="station-badge">K16</span>
          <span class="station-name-label">長堀橋</span>
        </div>
      </div>

      <!-- Slot 2: 長堀橋〜堺筋本町 走行中 -->
      <div class="bar-slot between-slot" id="slot-K16-K15">
        <div class="train-anchor" id="anchor-K16-K15"></div>
      </div>

      <!-- Slot 3: 堺筋本町駅 -->
      <div class="bar-slot station-slot" id="slot-K15">
        <div class="train-anchor" id="anchor-K15"></div>
        <div class="station-mark">
          <span class="station-badge">K15</span>
          <span class="station-name-label">堺筋本町</span>
        </div>
      </div>

      <!-- Slot 4: 堺筋本町〜北浜 走行中 -->
      <div class="bar-slot between-slot" id="slot-K15-K14">
        <div class="train-anchor" id="anchor-K15-K14"></div>
      </div>

      <!-- Slot 5: 一番下・北浜駅 -->
      <div class="bar-slot station-slot kitahama-slot" id="slot-K14">
        <div class="train-anchor" id="anchor-K14"></div>
        <div class="station-mark">
          <span class="station-badge kitahama-badge">K14</span>
          <span class="station-name-label kitahama-name">北浜</span>
        </div>
      </div>
    </aside>
  </div>

  <script src="app.js"></script>
</body>
</html>
