<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title></title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="container">
    <svg id="canvas" viewBox="0 0 360 640" preserveAspectRatio="xMidYMid meet">
      <!-- 定義・再利用シンボル -->
      <defs>
        <!-- 堺筋線カラーグラデーション -->
        <linearGradient id="sakaisujiGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#9C5B3D" />
          <stop offset="100%" stop-color="#6E381E" />
        </linearGradient>
        <!-- レール用グラデーション -->
        <linearGradient id="railGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#4A5568" />
          <stop offset="50%" stop-color="#CBD5E0" />
          <stop offset="100%" stop-color="#4A5568" />
        </linearGradient>
      </defs>

      <!-- 静的背景（線路・ホーム・駅サイン） -->
      <g id="track-infrastructure"></g>

      <!-- 動的列車レイヤー（電車イラスト・数字・行先・秒数） -->
      <g id="trains-layer"></g>
    </svg>
  </div>
  <script src="app.js"></script>
</body>
</html>
